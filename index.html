<html>
    <body>
        <h1>Perfect Stop</h1>
        <p>Pick a game</p>

        <button id="stop">Stop</button>
        <button>Bar</button>
        <button>Count</button>
        <button>Tap</button>
        <div id="game"></div>

        <p>Score: <span id="score">0 / 0</span></p>
        
    </body>
    <script>
    let stopButton = document.getElementById("stop");
    let score=0;
    let maxScore=0;

    stopButton.onclick = function() {
        let target = Math.random() * 10;
        target = target.toFixed(2);
        let runningTime = 0;

        game.innerHTML = `
            <h2>STOP</h2>
            <p>Target: ${target}</p>
            <h1 id="timer">0.00</h1>
            <button id="hit">STOP</button>
        `;
        let interval = setInterval(function() {
            runningTime+=0.01;
            document.getElementById("timer").textContent = runningTime.toFixed(2);
            
            if (runningTime >=10) {
                runningTime=0;
            }
        }, 10);
        document.getElementById("hit").onclick = function() {
            clearInterval(interval);
            
            let difference = Math.abs(runningTime - target);
            difference =  difference.toFixed(2);
            maxScore+=100;
            let points = Math.round(100-difference*10);
            if(points<0){
                points=0;
            }
            score+=points;
            document.getElementById("score").textContent=score+" / "+maxScore;
            game.innerHTML += `
            <p>You we ${difference} away!</p>
            `
        }
    };
    </script>
</html>
