<style>body{background:#001;color:wheat;font-family:monospace;text-align:center}button{cursor:pointer;color:white;background-color:#333333c5;border:1px solid red;border-radius:6px}button:hover{background:#555}#barGame{margin:20px auto;width:300px;border:2px solid;height:40px;position:relative}.tapArea#target{position:absolute;left:0;top:0}#marker{position:absolute;left:0}#target{position:absolute;left:50%}.tapArea{width:300px;height:250px;border:2px solid;position:relative}</style>
<h1>Perfect Stop</h1><p>Pick a game</p><p>Press to start</p><button id="sp">Stop</button> <button id="b">Bar</button> <button id="c">Count</button> <button id="t">Tap</button><div id="g"></div><p>Score: <span id="s"> 0/0</span>
<script>let SB=document.getElementById("sp");let b=document.getElementById("b");let s=0;let ms=0;document.getElementById("s").textContent=s+"/"+ms;let i;
    SB.onclick=function(){clearInterval(i);let tm=Math.random()*10;tm=tm.toFixed(2);let rt=0;g.innerHTML=`<h2>STOP</h2><p>Target: ${tm}</p><h1 id="x">0.00</h1><button id="hit">STOP</button>`;i=setInterval(function(){rt+=0.01;document.getElementById("x").textContent=rt.toFixed(2);if(rt>=10){rt=0;}},10);
        document.getElementById("hit").onclick=function(){
            clearInterval(i);let d=Math.abs(rt-tm);d=d.toFixed(2);ms+=100;let points=Math.round(100-d*10);
            if(points<0){
                points=0;
            }
            s+=points;
            document.getElementById("s").textContent=s+" / "+ms;
            g.innerHTML += `
            <p>You were ${d} away!</p>
            `
        }
    };

    b.onclick = function() {
        let position =0;
        let direction=1;
        g.innerHTML = `
            <h2>BAR</h2>
            <div id="barGame">
                <span id="marker">|</span>
                <span id="target">🎯</span>
            </div>
            <button id="barStop">STOP</button>
        `;
        let barInterval = setInterval(function() {
            position +=direction;

            if (position >=95 || position<=0) {
                direction *= -1;
            }
            document.getElementById("marker").style.left = position+"%";
        },10)

        document.getElementById("barStop").onclick= function() {
            clearInterval(barInterval);
            let points=Math.round(100-Math.abs(position-50)*2);
            if(points<0){
                points=0;
            }
            s+=points;
            ms+=100;

            document.getElementById("s").textContent=s+" / "+ms;
            g.innerHTML +=`<p>+${points} points!</p>`;
        }
    };
    let count = document.getElementById("c");
    count.onclick = function() {
        let countTime=0;
        let count = document.getElementById("c");
        g.innerHTML=`
        <h2>COUNT</h2>
        <p>Stop at 5 seconds</p>
        <h1 id="countTimer">0.00</h1>
        <button id="countStop">STOP</button>
        `;

        let countInterval = setInterval(function() {
            countTime += 0.01;
            if(countTime <=1) {
                document.getElementById("countTimer").textContent = countTime.toFixed(2);
            }else{
                document.getElementById("countTimer").textContent ="???";
            }
        },10);

        document.getElementById("countStop").onclick=function(){
            clearInterval(countInterval);

            let d=Math.abs(countTime-5);
            let points=Math.round(100-d*20);

            if(points<0) {points=0;}
            s+=points;
            ms+=100;

            document.getElementById("s").textContent=s+" / "+ms;
            g.innerHTML+=`
                <p>You stopped at ${countTime.toFixed(2)}</p>
                <p>+${points} points</p>
            `;
        }
    }

    let tap = document.getElementById("t");
    
    tap.onclick = function() {
        let startTime = performance.now()
        g.innerHTML= `
            <h2>TAP</h2>
            <p>Hit the target 5 times</p>
            <p>Hits: <span id="hit">0</span></p>
            <div class="tapArea">
                <button id="target">Tap!</button>    
            </div>
            <br/>
        `;
        let hits = 0;
        let target = document.getElementById("target");
        target.onclick=function() {
        hits++;
        document.getElementById("hit").textContent = hits;
        if (hits === 5) {
            let seconds = (performance.now() - startTime) / 1000;
            let points = Math.round(100 - seconds *10);
            s+=points;
            ms+=100;
            document.getElementById("s").textContent = s + "/" + ms

            g.innerHTML = `
                <p>Completed in ${seconds.toFixed(2)} seconds!</p>
                <p>+${points} points!</p>
            `;
            target.style.display = "none";
            return 
        } // not sure if it is counting right
        
        let x = Math.random() * 220;
        let y = Math.random() * 170;
        document.getElementById("target").style.left = x + "px";
        document.getElementById("target").style.top = y+"px";
        }
    }
</script>
