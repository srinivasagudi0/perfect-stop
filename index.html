<style>body{background:#001;color:wheat;font-family:monospace;text-align:center}button{cursor:pointer;color:white;background-color:#333333c5;border:1px solid red;border-radius:6px}button:hover{background:#555}#barGame{margin:20px auto;width:300px;border:2px solid;height:40px;position:relative}.tapArea #target{position:absolute;left:0;top:0}#marker{position:absolute;left:0}#target{position:absolute;left:50%}.tapArea{width:300px;height:250px;border:2px solid;position:relative}</style>
<h1>Perfect Stop</h1><p>Pick a game</p><p>Press to start</p><button id="sp">Stop</button> <button id="b">Bar</button> <button id="c">Count</button> <button id="t">Tap</button><div id="g"></div><p>Score: <span id="s">0/0</span>
<script>let E=id=>document.getElementById(id);let SB=E("sp");let b=E("b");let s=0,ms=0;function add(n){n=Math.max(0,n);s+=n;ms+=100;E("s").textContent=s+"/"+ms;return n}let i;SB.onclick=()=>{clearInterval(i);let tm=Math.random()*10;tm=tm.toFixed(2);let rt=0;g.innerHTML=`<h2>STOP</h2><p>Target: ${tm}</p><h1 id="x">0.00</h1><button id="hit">STOP</button>`;i=setInterval(()=>{rt+=0.01;E("x").textContent=rt.toFixed(2);if(rt>=10)rt=0},10);E("hit").onclick=()=>{clearInterval(i);E("hit").disabled=true;let d=Math.abs(rt-tm);d=d.toFixed(2);let points=Math.round(100-d*10);points=add(points);g.innerHTML+=`<p>You were ${d} away!</p>`}};b.onclick=()=>{let p=0;let dr=1;g.innerHTML=`<h2>BAR</h2><div id="barGame"><span id="marker">|</span><span id="target">🎯</span></div><button id="barStop">STOP</button>`;let bi=setInterval(()=>{p+=dr;if(p>=95||p<=0)dr*=-1;E("marker").style.left=p+"%"},10);E("barStop").onclick=()=>{clearInterval(bi);E("barStop").disabled=true;let points=Math.round(100-Math.abs(p-50)*2);points=add(points);g.innerHTML+=`<p>+${points} points!</p>`}};let count=E("c");count.onclick=()=>{let ct=0;g.innerHTML=`<h2>COUNT</h2><p>Stop at 5 seconds</p><h1 id="countTimer">0.00</h1><button id="countStop">STOP</button>`;let ci=setInterval(()=>{ct+=0.01;if(ct<=1)E("countTimer").textContent=ct.toFixed(2);else E("countTimer").textContent="???"},10);E("countStop").onclick=()=>{clearInterval(ci);E("countStop").disabled=true;let d=Math.abs(ct-5);let points=Math.round(100-d*20);points=add(points);g.innerHTML+=`<p>You stopped at ${ct.toFixed(2)}</p><p>+${points} points</p>`}};let tap=E("t");tap.onclick=()=>{let startTime=performance.now();g.innerHTML=`<h2>TAP</h2><p>Hit the target 5 times</p><p>Hits: <span id="hit">0</span></p><div class="tapArea"><button id="target">Tap!</button></div><br/>`;let hits=0;let target=E("target");target.onclick=()=>{hits++;E("hit").textContent=hits;if(hits===5){let seconds=(performance.now()-startTime)/1000;let points=Math.round(100-seconds*10);points=add(points);g.innerHTML=`<p>Completed in ${seconds.toFixed(2)} seconds!</p><p>+${points} points!</p>`;return}let x=Math.random()*220;let y=Math.random()*170;target.style.left=x+"px";target.style.top=y+"px"}};</script>
