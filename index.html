<html>
    <style>
        #barGame{
            width:300px;
            border:2px solid;
            height:40px;
            position: relative;
        }
        #marker{
            position:absolute;
            left:0;
        }
        #target{
            position:absolute;
            left:50%;
        }
    </style>
    <body>
        <h1>Perfect Stop</h1>
        <p>Pick a game</p>

        <button id="stop">Stop</button>
        <button id="bar">Bar</button>
        <button id="count">Count</button>
        <button>Tap</button>
        <div id="game"></div>

        <p>Score: <span id="score">0 / 0</span></p>
        
    </body>
    <script>
    let stopButton = document.getElementById("stop");
    let bar = document.getElementById("bar");
    let score=0;
    let maxScore=0;
    document.getElementById("score").textContent=score+" / "+maxScore;

    stopButton.onclick = function() {
        let target = Math.random() * 10;
        target = target.toFixed(2);
        let runningTime = 0;

        game.innerHTML = `
            <h2>STOP</h2>
            <p>Target: ${target}</p>
            <h1 id="timer">0.00</h1>
            <button id="hit">STOP</button>
        `;
        let interval = setInterval(function() {
            runningTime+=0.01;
            document.getElementById("timer").textContent = runningTime.toFixed(2);
            
            if (runningTime >=10) {
                runningTime=0;
            }
        }, 10);
        document.getElementById("hit").onclick = function() {
            clearInterval(interval);
            
            let difference = Math.abs(runningTime - target);
            difference =  difference.toFixed(2);
            maxScore+=100;
            let points = Math.round(100-difference*10);
            if(points<0){
                points=0;
            }
            score+=points;
            document.getElementById("score").textContent=score+" / "+maxScore;
            game.innerHTML += `
            <p>You we ${difference} away!</p>
            `
        }
    };

    bar.onclick = function() {
        let position =0;
        let direction=1;
        game.innerHTML = `
            <h2>BAR</h2>
            <div id="barGame">
                <span id="marker">|</span>
                <span id="target">🎯</span>
            </div>
            <button id="barStop">STOP</button>
        `;
        let barInterval = setInterval(function() {
            position +=direction;

            if (position >=95 || position<=0) {
                direction *= -1;
            }
            document.getElementById("marker").style.left = position+"%";
        },10)

        document.getElementById("barStop").onclick= function() {
            clearInterval(barInterval);
            let points=Math.round(100-Math.abs(position-50)*2);
            if(points<0){
                points=0;
            }
            score+=points;
            maxScore+=100;

            document.getElementById("score").textContent=score+" / "+maxScore;
            game.innerHTML +=`<p>+${points} points!</p>`;
        }
    };
    let count = document.getElementById("count");
    count.onclick = function() {
        let countTime=0;
        let count = document.getElementById("count");
        game.innerHTML=`
        <h2>COUNT</h2>
        <p>Stop at 5 seconds</p>
        <h1 id="countTimer">0.00</h1>
        <button id="countStop">STOP</button>
        `;

        let countInterval = setInterval(function() {
            countTime += 0.1;
            if(countTime <=1) {
                document.getElementById("counterTimer").textContent = countTime.toFixed(2);
            }else{
                document.getElementById("countTimer").textContent ="???";
            }
        },10);

        document.getElementById("countStop").onclick=function(){
            clearInterval(interval);

            let difference=Math.abs(countTime-5);
            let points=Math.round(100-difference*20);

            if(points<0) {points=0;}
            score+=points;
            maxScore+=100;

            document.getElementById("score").textContent=score+" / "+maxScore;
            game.innerHTML+=`
                <p>You stopped at ${countTime.toFixed(2)}</p>
                <p>+${points} points</p>
            `;
        }
    }
    </script>
</html>
